# fly.toml app configuration file generated for quantro-flow-api on 2026-09-18T04:38:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quantro-flow-api'
primary_region = 'ord'

[build]
  dockerfile = 'backend/Dockerfile'
  ignorefile = '.dockerignore'

[env]
  DB_NAME = 'quantro_os'
  PORT = '8000'
  QUANTRO_ACTIONS_PRIMARY = 'mongo'
  QUANTRO_DB_PRIMARY = 'supabase'
  QUANTRO_MONGO_MIRROR = '1'
  QUANTRO_SECRETS_PRIMARY = 'mongo'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
