# Quantro-flow API — https://fly.io
app = "quantro-flow-api"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"
  ignorefile = ".dockerignore"

[env]
  PORT = "8000"
  DB_NAME = "quantro_os"
  QUANTRO_DB_PRIMARY = "supabase"
  QUANTRO_MONGO_MIRROR = "1"
  QUANTRO_ACTIONS_PRIMARY = "mongo"
  QUANTRO_SECRETS_PRIMARY = "mongo"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
