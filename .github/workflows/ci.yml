name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Phase identity / OAuth / actions tests
        run: |
          PYTHONPATH=backend pytest \
            test_phase1_identity_sot.py \
            test_phase2_oauth_secrets.py \
            test_phase3_actions_postgres.py \
            -q

      - name: Backend package tests
        working-directory: backend
        run: PYTHONPATH=. pytest tests/ -q

      - name: Import smoke (oauth / secrets / actions store)
        working-directory: backend
        run: |
          PYTHONPATH=. python -c "import google_oauth; import provider_secrets_store; import actions.store"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm ci

      - name: Build frontend
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build
